<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #18222d; color: #fff; }
    .card { background: #222e3c; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
    button { width: 100%; padding: 10px; background: #2481cc; color: white; border: none; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>
  <h3>P2P Market Orderbook</h3>
  
  <div class="card">
    <p><b>BUY USDT</b> - Rate: 115.5 ETB</p>
    <p>Limits: 10 - 500 USDT | Bank Transfer</p>
    <button onclick="buyCrypto()">Trade</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function buyCrypto() {
      tg.sendData(JSON.stringify({ action: "buy", amount: 50, rate: 115.5 }));
      tg.close();
    }
  </script>
</body>
</html>
