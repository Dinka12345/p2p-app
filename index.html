<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDT P2P Market</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #17212b; color: #fff; }
    .card { background: #232e3c; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    input, select, button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: none; box-sizing: border-box; }
    button { background: #2481cc; color: white; font-weight: bold; cursor: pointer; }
    input { background: #0f1721; color: white; }
  </style>
</head>
<body>
  <h2>P2P USDT Exchange</h2>

  <!-- Create Order Section -->
  <div class="card">
    <h3>Sell USDT (Create Offer)</h3>
    <input type="number" id="amount" placeholder="USDT Amount (e.g. 50)">
    <input type="number" id="rate" placeholder="Rate per USDT">
    <input type="text" id="payment" placeholder="Payment Method (e.g. Telebirr/CBE)">
    <button onclick="createOffer()">Post Sell Offer</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function createOffer() {
      const amount = document.getElementById('amount').value;
      const rate = document.getElementById('rate').value;
      const payment = document.getElementById('payment').value;

      if (!amount || !rate) {
        alert("Please enter amount and rate");
        return;
      }

      tg.sendData(JSON.stringify({
        action: "create_sell_order",
        amount: amount,
        rate: rate,
        payment_method: payment
      }));
      tg.close();
    }
  </script>
</body>
</html>
