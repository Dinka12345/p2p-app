<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Trading Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 15px; background: #18222d; color: #fff; margin: 0; }
    .card { background: #222e3c; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #334455; background: #10171e; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    .btn-kyc { background: #f39c12; color: white; }
    .btn-deposit { background: #2baf60; color: white; }
    .btn-withdraw { background: #e53935; color: white; }
    .btn-ad { background: #2481cc; color: white; }
    .user-info { font-size: 0.85em; color: #8fa1b2; margin-bottom: 8px; }
    .grid { display: flex; gap: 10px; }
  </style>
</head>
<body>

  <h3>P2P Trading Hub</h3>

  <div class="card">
    <div class="user-info">User: <span id="user-name">Loading...</span> | ID: <span id="user-id">--</span></div>
    <button class="btn-kyc" onclick="startKYC()">🪪 Upload National ID (Front & Back)</button>
  </div>

  <div class="card">
    <h4>Deposit & Withdrawal</h4>
    <label for="trans-amount">Amount (ETB):</label>
    <input type="number" id="trans-amount" placeholder="Enter amount">
    <div class="grid">
      <button class="btn-deposit" onclick="submitTransaction('deposit')">Deposit</button>
      <button class="btn-withdraw" onclick="submitTransaction('withdraw')">Withdraw</button>
    </div>
  </div>

  <div class="card">
    <h4>Post P2P Ad</h4>
    <label for="ad-type">Type:</label>
    <select id="ad-type">
      <option value="BUY">BUY USDT</option>
      <option value="SELL">SELL USDT</option>
    </select>

    <label for="ad-amount">Amount (USDT):</label>
    <input type="number" id="ad-amount" placeholder="e.g. 100">

    <label for="ad-rate">Rate (ETB):</label>
    <input type="number" id="ad-rate" placeholder="e.g. 118.5">

    <button class="btn-ad" onclick="postAd()">Post Trade Ad</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('user-name').innerText = user.first_name || user.username;
      document.getElementById('user-id').innerText = user.id;
    }

    function startKYC() {
      alert("Closing app... Please attach and send the photos of your ID directly in the chat window!");
      tg.sendData(JSON.stringify({ action: "start_kyc" }));
      tg.close();
    }

    function submitTransaction(actionType) {
      const amount = parseFloat(document.getElementById('trans-amount').value);
      if (!amount || amount <= 0) return alert("Enter a valid amount.");

      tg.sendData(JSON.stringify({ action: actionType, amount: amount }));
      tg.close();
    }

    function postAd() {
      const adType = document.getElementById('ad-type').value;
      const amount = parseFloat(document.getElementById('ad-amount').value);
      const rate = parseFloat(document.getElementById('ad-rate').value);

      if (!amount || !rate) return alert("Fill in valid amount and rate.");

      tg.sendData(JSON.stringify({ action: "create_ad", ad_type: adType, amount: amount, rate: rate }));
      tg.close();
    }
  </script>
</body>
</html>
