<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Trading Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 15px; background: #18222d; color: #fff; margin: 0; }
    .card { background: #222e3c; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #334455; background: #10171e; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; background: #2481cc; color: white; }
    .status-box { margin-top: 10px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <h3>P2P Exchange Desk</h3>

  <div class="card">
    <h4>📢 Post Trade Ad</h4>
    <label for="ad-type">Type:</label>
    <select id="ad-type">
      <option value="BUY">BUY USDT</option>
      <option value="SELL">SELL USDT</option>
    </select>

    <label for="ad-amount">Amount (USDT):</label>
    <input type="number" id="ad-amount" placeholder="e.g. 100">

    <label for="ad-rate">Rate (ETB):</label>
    <input type="number" id="ad-rate" placeholder="e.g. 118.5">

    <button onclick="postAd()">Post Advertisement</button>
    <div id="status-msg" class="status-box"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Replace LOCAL_SERVER_URL with your local IP or public tunnel URL if hosting remotely
    const API_URL = "http://localhost:8080/api/create_ad";

    async function postAd() {
      const user = tg.initDataUnsafe?.user;
      const statusDiv = document.getElementById('status-msg');
      
      const adType = document.getElementById('ad-type').value;
      const amount = parseFloat(document.getElementById('ad-amount').value);
      const rate = parseFloat(document.getElementById('ad-rate').value);

      if (!amount || amount <= 0 || !rate || rate <= 0) {
        alert("Please enter valid amount and rate.");
        return;
      }

      statusDiv.style.color = "#f1c40f";
      statusDiv.innerText = "Posting advertisement...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: user ? user.id : 0,
            ad_type: adType,
            amount: amount,
            rate: rate
          })
        });

        const result = await response.json();

        if (result.success) {
          statusDiv.style.color = "#2ecc71";
          statusDiv.innerText = "✅ " + result.message;
          document.getElementById('ad-amount').value = "";
          document.getElementById('ad-rate').value = "";
        } else {
          statusDiv.style.color = "#e74c3c";
          statusDiv.innerText = "❌ " + result.message;
        }
      } catch (err) {
        statusDiv.style.color = "#e74c3c";
        statusDiv.innerText = "❌ Connection error. Ensure backend is running.";
      }
    }
  </script>
</body>
</html>
