<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Marketplace</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        h2, h3 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div id="app">
        <h2>P2P Wallet</h2>
        <div class="card">
            <p>Welcome, <b id="user-name">Trader</b>!</p>
            <p>USDT Balance: <span id="balance">100.00</span> USDT</p>
        </div>

        <h3>Active Marketplace</h3>
        <div class="card">
            <p>No active ads yet. Ready to trade!</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById("user-name").innerText = user.first_name;
        }
    </script>
</body>
</html>
