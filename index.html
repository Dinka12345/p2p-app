<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AllP2P Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-main: #13151b; --bg-card: #1e2329; --text-main: #ffffff; --text-muted: #848e9c; --accent-red: #f04a5d; --accent-yellow: #fbd743; --btn-bg: #2b3139; }
        body { margin: 0; background-color: var(--bg-main); color: var(--text-main); font-family: sans-serif; padding-bottom: 80px; }
        
        /* Tab Views */
        .view { display: none; padding: 16px; }
        .view.active { display: block; }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background-color: var(--bg-main); border-top: 1px solid var(--btn-bg); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 10px; gap: 4px; cursor: pointer; }
        .nav-item.active { color: var(--accent-yellow); }
        .nav-item i { font-size: 18px; }
        
        /* Basic Styling for content */
        .card { background-color: var(--bg-card); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    </style>
</head>
<body>

    <!-- Home View -->
    <div id="home" class="view active">
        <h2>Home</h2>
        <div class="card">P2P Trading Market goes here...</div>
    </div>

    <!-- Orders View -->
    <div id="orders" class="view">
        <h2>My Orders</h2>
        <div class="card">No active orders found.</div>
    </div>

    <!-- Ads View -->
    <div id="ads" class="view">
        <h2>Ads</h2>
        <div class="card">Post your P2P advertisement.</div>
    </div>

    <!-- Wallet View -->
    <div id="wallet" class="view">
        <h2>Wallet</h2>
        <div class="card">Balance: 0.00 USDT</div>
    </div>

    <!-- More View -->
    <div id="more" class="view">
        <h2>More</h2>
        <div class="card">Settings, Support, etc.</div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <i class="fa-solid fa-house"></i><span>Home</span>
        </div>
        <div class="nav-item" onclick="switchTab('orders', this)">
            <i class="fa-regular fa-file-lines"></i><span>Orders</span>
        </div>
        <div class="nav-item" onclick="switchTab('ads', this)">
            <i class="fa-solid fa-bullhorn"></i><span>Ads</span>
        </div>
        <div class="nav-item" onclick="switchTab('wallet', this)">
            <i class="fa-solid fa-wallet"></i><span>Wallet</span>
        </div>
        <div class="nav-item" onclick="switchTab('more', this)">
            <i class="fa-solid fa-ellipsis"></i><span>More</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function switchTab(tabId, element) {
            // Hide all views
            document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
            // Remove active class from nav items
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            // Show selected view
            document.getElementById(tabId).classList.add('active');
            // Set active class on clicked nav item
            element.classList.add('active');
        }
    </script>
</body>
</html>
