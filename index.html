<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>P2P Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        h2 { font-size: 20px; margin-bottom: 8px; }
        .card {
            background: rgba(128, 128, 128, 0.1);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px 0;
            border: 1px solid var(--hint-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create P2P Offer</h2>
        <div class="card">
            <label for="amount">Amount (USDT):</label>
            <input type="number" id="amount" placeholder="0.00">

            <label for="fiatMethod">Payment Method:</label>
            <select id="fiatMethod">
                <option value="bank_transfer">Bank Transfer</option>
                <option value="local_p2p">Local P2P / Mobile Money</option>
            </select>

            <button id="submitBtn" onclick="submitOffer()">Publish Offer</button>
        </div>
    </div>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        function submitOffer() {
            const amount = document.getElementById('amount').value;
            const method = document.getElementById('fiatMethod').value;

            if (!amount || amount <= 0) {
                tg.showAlert("Please enter a valid amount.");
                return;
            }

            // Data payload to send back to the bot server via WebApp data passing or fetch API
            const payload = {
                action: "create_offer",
                amount: amount,
                method: method,
                initData: tg.initData // Essential for verifying user authenticity server-side
            };

            // Send data back to bot / backend
            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
