<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethiop2p Marketplace</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .balance-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .balance-title {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-weight: bold;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .ad-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .ad-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .seller-name {
            font-weight: bold;
        }

        .ad-price {
            font-size: 18px;
            color: var(--accent-color);
            font-weight: bold;
        }

        .ad-details {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            box-sizing: border-box;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Ethiop2p Express</h2>
        <span id="user-display">Loading...</span>
    </div>

    <div class="balance-card">
        <div class="balance-title">USDT Balance</div>
        <div class="balance-amount" id="wallet-balance">0.00 USDT</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('market')">Market</button>
        <button class="tab-btn" onclick="switchTab('post')">Post Ad</button>
    </div>

    <!-- Marketplace View -->
    <div id="tab-market">
        <div id="ads-container">Loading P2P offers...</div>
    </div>

    <!-- Create Ad View -->
    <div id="tab-post" style="display: none;">
        <div class="form-group">
            <label>Order Type</label>
            <select id="ad-type">
                <option value="SELL">SELL USDT</option>
                <option value="BUY">BUY USDT</option>
            </select>
        </div>
        <div class="form-group">
            <label>Payment Method</label>
            <select id="ad-payment">
                <option value="CBE">CBE (Commercial Bank of Ethiopia)</option>
                <option value="Telebirr">Telebirr</option>
                <option value="BOA">Bank of Abyssinia</option>
            </select>
        </div>
        <div class="form-group">
            <label>Price per USDT (ETB)</label>
            <input type="number" id="ad-price" placeholder="140.50" step="0.1">
        </div>
        <div class="form-group">
            <label>Total USDT Amount</label>
            <input type="number" id="ad-amount" placeholder="50.00">
        </div>
        <div class="form-group">
            <label>Account Number</label>
            <input type="text" id="ad-acc-num" placeholder="100012345678">
        </div>
        <div class="form-group">
            <label>Account Holder Name</label>
            <input type="text" id="ad-acc-name" placeholder="Abebe B.">
        </div>
        <button class="btn" onclick="submitAd()">Publish Offer</button>
    </div>

    <!-- Trade Escrow Modal -->
    <div class="modal" id="trade-modal">
        <div class="modal-content">
            <h3>Initiate Trade</h3>
            <p id="trade-info">Enter amount to buy:</p>
            <div class="form-group">
                <label>USDT Amount</label>
                <input type="number" id="trade-amount" placeholder="10.0">
            </div>
            <button class="btn" id="confirm-trade-btn">Lock Funds in Escrow</button>
            <button class="btn" style="background-color: var(--border-color); margin-top: 8px;" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR LIVE RENDER BASE URL
        const API_BASE = "https://p2p-miniapp.onrender.com";

        let tg = window.Telegram.WebApp;
        tg.expand();

        let userId = tg.initDataUnsafe?.user?.id || 12345678;
        let userName = tg.initDataUnsafe?.user?.first_name || "Trader";
        document.getElementById('user-display').innerText = `@${userName}`;

        let currentSelectedAdId = null;

        async function fetchWallet() {
            try {
                const res = await fetch(`${API_BASE}/api/wallet/${userId}`);
                const data = await res.json();
                document.getElementById('wallet-balance').innerText = `${data.usdt_balance.toFixed(2)} USDT`;
            } catch (err) {
                console.error("Failed to load wallet balance:", err);
            }
        }

        async function fetchMarketplace() {
            try {
                const res = await fetch(`${API_BASE}/api/marketplace`);
                const data = await res.json();
                const container = document.getElementById('ads-container');
                container.innerHTML = '';

                if (data.ads.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-secondary);">No active offers currently.</p>';
                    return;
                }

                data.ads.forEach(ad => {
                    const card = document.createElement('div');
                    card.className = 'ad-card';
                    card.innerHTML = `
                        <div class="ad-header">
                            <span class="seller-name">${ad.seller_name} (${ad.payment})</span>
                            <span class="ad-price">${ad.price} ETB</span>
                        </div>
                        <div class="ad-details">
                            Available: ${ad.total_amount} USDT<br>
                            Limit: ${ad.min_limit} - ${ad.max_limit} USDT<br>
                            Pay To: ${ad.acc_name} (${ad.acc_num})
                        </div>
                        <button class="btn" onclick="openTradeModal(${ad.id})">Buy USDT</button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                document.getElementById('ads-container').innerText = 'Error connecting to backend.';
            }
        }

        async function submitAd() {
            const payload = {
                user_id: userId,
                type: document.getElementById('ad-type').value,
                payment: document.getElementById('ad-payment').value,
                price: parseFloat(document.getElementById('ad-price').value),
                total_amount: parseFloat(document.getElementById('ad-amount').value),
                min_limit: 5.0,
                max_limit: parseFloat(document.getElementById('ad-amount').value),
                acc_num: document.getElementById('ad-acc-num').value,
                acc_name: document.getElementById('ad-acc-name').value
            };

            try {
                const res = await fetch(`${API_BASE}/api/ads/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    alert('Offer successfully published!');
                    switchTab('market');
                }
            } catch (err) {
                alert('Failed to submit offer.');
            }
        }

        function openTradeModal(adId) {
            currentSelectedAdId = adId;
            document.getElementById('trade-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('trade-modal').style.display = 'none';
        }

        document.getElementById('confirm-trade-btn').onclick = async function() {
            const amount = parseFloat(document.getElementById('trade-amount').value);
            if (!amount) return alert('Enter valid amount');

            try {
                const res = await fetch(`${API_BASE}/api/trades/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ad_id: currentSelectedAdId,
                        buyer_id: userId,
                        amount_usdt: amount
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    alert(`Trade #${data.trade.trade_id} Created!\nPlease transfer ${data.trade.fiat_amount} ETB to account ${data.trade.payment_info.acc_num} (${data.trade.payment_info.acc_name}).`);
                    closeModal();
                } else {
                    alert('Error creating trade: ' + data.detail);
                }
            } catch (err) {
                alert('Failed to initiate escrow trade.');
            }
        };

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (tab === 'market') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-market').style.display = 'block';
                document.getElementById('tab-post').style.display = 'none';
                fetchMarketplace();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-market').style.display = 'none';
                document.getElementById('tab-post').style.display = 'block';
            }
        }

        // Initial Load
        fetchWallet();
        fetchMarketplace();
    </script>
</body>
</html>
