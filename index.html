<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Registration & Trading</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 15px; background: #18222d; color: #fff; margin: 0; }
    .card { background: #222e3c; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #334455; background: #10171e; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    .btn-primary { background: #2481cc; color: white; }
    .btn-success { background: #2baf60; color: white; }
    .user-info { font-size: 0.85em; color: #8fa1b2; margin-bottom: 8px; }
  </style>
</head>
<body>

  <h3>P2P Account Registration</h3>

  <div class="card">
    <div class="user-info">User: <span id="user-name">Loading...</span></div>
    <label for="reg-id">Telegram Account ID:</label>
    <input type="number" id="reg-id" placeholder="Your Telegram ID">
    <button class="btn-primary" onclick="requestRegistration()">Submit ID for Admin Approval</button>
  </div>

  <div class="card">
    <h4>Create P2P Ad</h4>
    <label for="ad-type">Type:</label>
    <select id="ad-type">
      <option value="BUY">BUY USDT</option>
      <option value="SELL">SELL USDT</option>
    </select>

    <label for="amount">Amount (USDT):</label>
    <input type="number" id="amount" placeholder="e.g. 100">

    <label for="rate">Rate (ETB):</label>
    <input type="number" id="rate" placeholder="e.g. 118.5">

    <button class="btn-success" onclick="postAd()">Post Trade Ad</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('user-name').innerText = user.first_name || user.username;
      document.getElementById('reg-id').value = user.id;
    }

    function requestRegistration() {
      const inputId = parseInt(document.getElementById('reg-id').value);
      if (!inputId) {
        alert("Please enter a valid Telegram ID.");
        return;
      }

      tg.sendData(JSON.stringify({
        action: "request_registration",
        user_id: inputId
      }));
      tg.close();
    }

    function postAd() {
      const adType = document.getElementById('ad-type').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const rate = parseFloat(document.getElementById('rate').value);

      if (!amount || !rate) {
        alert("Please enter a valid amount and rate.");
        return;
      }

      tg.sendData(JSON.stringify({
        action: "create_ad",
        ad_type: adType,
        amount: amount,
        rate: rate
      }));

      tg.close();
    }
  </script>
</body>
</html>
